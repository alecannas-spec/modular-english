<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarica l'app — Modular English</title>
<style>
  :root{ --navy:#0a1f4a; --navy2:#13346b; --gold:#C8A227; --ink:#1a2233; --mut:#5b6475; --line:#e3e8f2; --card:#fff; --bg:#f6f8fc; }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ink:#e9eefc; --mut:#9aa6c0; --line:#243356; --card:#0e1630; --bg:#070c1e; --navy2:#9fb4e6; } }
  :root[data-theme="dark"]{ --ink:#e9eefc; --mut:#9aa6c0; --line:#243356; --card:#0e1630; --bg:#070c1e; --navy2:#9fb4e6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:34px 20px 28px;text-align:center}
  .tag{display:inline-block;background:var(--gold);color:var(--navy);font:800 11px system-ui;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
  h1{font-size:1.9rem;margin:14px 0 6px}
  header p{margin:0;color:#c7d3ef;font-size:1rem}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 20px}
  .box{max-width:460px;width:100%;text-align:center}
  .badges{display:flex;flex-direction:column;gap:14px;margin:26px 0 8px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:12px;width:100%;max-width:320px;background:#000;color:#fff;border-radius:12px;padding:12px 18px;text-decoration:none;transition:transform .12s,opacity .12s}
  .badge:hover{transform:translateY(-1px)}
  .badge svg{flex:0 0 auto}
  .badge .b-sub{font:500 11px system-ui;opacity:.85;line-height:1.1}
  .badge .b-main{font:700 20px system-ui;line-height:1.15;letter-spacing:.2px}
  .badge.soon{background:#2a2f3a;opacity:.65;cursor:default;pointer-events:none}
  .badge .soon-tag{margin-left:auto;font:700 11px system-ui;background:var(--gold);color:#000;padding:3px 8px;border-radius:999px}
  .note{color:var(--mut);font-size:.88rem;margin-top:18px}
  footer{text-align:center;padding:18px;color:var(--mut);font-size:.82rem}
  footer a{color:var(--navy2)}
</style>
</head>
<body>
<header>
  <span class="tag">Modular English</span>
  <h1>Scarica l'app</h1>
  <p>Impara l'inglese per situazioni · Get the app</p>
</header>

<main>
  <div class="box">
    <p>Porta Modular English sul tuo telefono. Scarica l'app dallo store del tuo dispositivo.</p>
    <div class="badges" id="badges"></div>
    <p class="note">Puoi anche usare Modular English direttamente dal browser su <a href="/">okmodularenglish.com</a>.</p>
  </div>
</main>

<footer>© Modular English · <a href="/privacy3.html">Privacy</a> · <a href="/">Sito</a></footer>

<script>
/* ─── INCOLLA QUI I LINK DEGLI STORE ──────────────────────────────────────
   Lascia la stringa vuota ("") finché l'app non è pubblicata: il pulsante
   mostrerà automaticamente "Presto disponibile".                            */
var APP_STORE_URL  = "";   // es. https://apps.apple.com/it/app/modular-english/idXXXXXXXXXX
var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.modularenglish.app";
/* ─────────────────────────────────────────────────────────────────────── */

var APPLE_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.42 2.22-1.17 3.03-.9.96-2.37 1.71-3.6 1.62-.15-1.17.42-2.37 1.14-3.12.81-.87 2.25-1.53 3.63-1.56zM20.9 17.1c-.57 1.32-.84 1.9-1.59 3.06-1.02 1.62-2.46 3.63-4.26 3.63-1.59.03-2-.99-4.14-.99-2.13 0-2.58.96-4.08 1.02-1.77.06-3.12-1.74-4.14-3.36C-1.26 17.37-1.65 11.1 1.23 7.56c1.14-1.41 2.94-2.31 4.56-2.31 1.68 0 2.73 1.02 4.11 1.02 1.35 0 2.19-1.02 4.14-1.02 1.44 0 2.97.78 4.05 2.13-3.57 1.95-2.97 7.02-1.29 9.72z"/></svg>';
var PLAY_SVG  = '<svg width="24" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D2FF" d="M3.6 1.8 13.3 11.5 3.6 21.2c-.4-.2-.7-.6-.7-1.2V3c0-.6.3-1 .7-1.2z"/><path fill="#00F076" d="M3.6 1.8c.3-.16.7-.17 1.1.06l11.3 6.46-2.7 2.7L3.6 1.8z"/><path fill="#FFCE00" d="M16 8.32 20 10.6c.9.52.9 1.86 0 2.38l-4 2.28-2.7-2.7L16 8.32z"/><path fill="#FF3A44" d="M3.6 21.2 13.3 11.5l2.7 2.7-11.3 6.46c-.4.23-.8.22-1.1.04z"/></svg>';

function badge(url, svg, sub, main){
  var ready = !!(url && /^https?:\/\//.test(url));
  var el = document.createElement(ready ? 'a' : 'div');
  el.className = 'badge' + (ready ? '' : ' soon');
  if(ready){ el.href = url; el.target = '_blank'; el.rel = 'noopener'; }
  el.innerHTML = svg
    + '<span><span class="b-sub">'+sub+'</span><br><span class="b-main">'+main+'</span></span>'
    + (ready ? '' : '<span class="soon-tag">Presto</span>');
  return el;
}
(function(){
  var box = document.getElementById('badges');
  box.appendChild(badge(APP_STORE_URL,  APPLE_SVG, 'Scarica su', 'App Store'));
  box.appendChild(badge(PLAY_STORE_URL, PLAY_SVG,  'Disponibile su', 'Google Play'));
})();
</script>
</body>
</html>
